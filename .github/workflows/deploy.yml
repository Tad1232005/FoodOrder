name: CI/CD FoodOrder

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Admin
        run: |
          cd admin
          npm install
          npm run build

      - name: Install Backend
        run: |
          cd backend
          npm install

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}

      - name: Deploy Frontend to Vercel
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK_FRONTEND }}

      - name: Deploy Admin to Vercel
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}